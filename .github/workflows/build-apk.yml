name: Build Android APK/AAB (Workflow Dispatch)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build APK & AAB (${{ inputs.build_type }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "⚠️ GOOGLE_SERVICES_JSON_BASE64 not set"
            if [ "${{ inputs.build_type }}" = "release" ]; then
              echo "❌ Release build requires GOOGLE_SERVICES_JSON_BASE64 secret"
              exit 1
            fi
            mkdir -p android/app/src/main
            echo '{}' > android/app/google-services.json
          else
            mkdir -p android/app/src/main
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Create keystore directory
        run: mkdir -p android/keystore

      - name: Decode and write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️ ANDROID_KEYSTORE_BASE64 not set - debug build only"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release_new.jks
            echo "✓ Keystore decoded"
          fi

      - name: Build APK (${{ inputs.build_type }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: |
          set -o pipefail
          if [ "${{ inputs.build_type }}" = "release" ]; then
            flutter build apk --release 2>&1 | tee apk_build.log
          else
            flutter build apk --debug 2>&1 | tee apk_build.log
          fi

      - name: Verify APK artifact
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found"
            echo "Build outputs:"
            find build/app/outputs -type f 2>/dev/null || echo "No outputs directory"
            exit 1
          fi
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))
          echo "✓ APK built successfully"
          echo "  Path: $APK_PATH"
          echo "  Size: ${APK_SIZE_MB} MB"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build AAB (${{ inputs.build_type }})
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
        run: |
          set -o pipefail
          if [ "${{ inputs.build_type }}" = "release" ]; then
            flutter build appbundle --release 2>&1 | tee aab_build.log
          else
            echo "⚠️ Debug AAB not supported - skipping"
            exit 0
          fi

      - name: Verify AAB artifact
        if: inputs.build_type == 'release'
        run: |
          AAB_PATH=$(find build/app/outputs/bundle/release -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "⚠️ WARNING: AAB not found"
            find build/app/outputs -type f 2>/dev/null || echo "No outputs"
            exit 0
          fi
          AAB_SIZE=$(stat -f%z "$AAB_PATH" 2>/dev/null || stat -c%s "$AAB_PATH")
          AAB_SIZE_MB=$((AAB_SIZE / 1024 / 1024))
          echo "✓ AAB built successfully"
          echo "  Path: $AAB_PATH"
          echo "  Size: ${AAB_SIZE_MB} MB"

      - name: Upload AAB artifact
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.build_type }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: warn

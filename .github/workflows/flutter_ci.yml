name: Flutter CI

# CI (PR / push): analyze・test・debug ビルドのみ。署名鍵は使わない。
# release の AAB/APK は workflow_dispatch (release=true) 専用。必要な Secrets が無ければ失敗する。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'release の APK/AAB をビルドする（署名 Secrets 必須）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # error のみ対象（info は無視）。件数は ci/analyze_error_baseline.txt を超えたら失敗。
      - name: Run Flutter Analyzer
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          python3 scripts/ci_guard.py analyze analyze.log ci/analyze_error_baseline.txt

      # 失敗件数が ci/test_failure_baseline.txt を超えたら失敗（回帰ガード）。
      # テストを直して失敗件数が減ったら、同じPRでベースラインも下げること。
      - name: Run Tests (regression guard)
        run: |
          flutter test --machine > test_results.jsonl || true
          python3 scripts/ci_guard.py tests test_results.jsonl ci/test_failure_baseline.txt

      - name: Generate code (build_runner)
        timeout-minutes: 10
        run: |
          # lib/test に生成コード(part '*.g.dart' / '*.freezed.dart')を使うソースが無ければ不要。
          # 旧 analyzer 7.x と Dart 3.12 の不整合で build_runner が無限待機するため、不要時はスキップする。
          if grep -rEq "^part '.*\.(g|freezed)\.dart';" lib test; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No generated-code 'part' directives found - skipping build_runner"
          fi

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        timeout-minutes: 10
        run: |
          # lib/test に生成コード(part '*.g.dart' / '*.freezed.dart')を使うソースが無ければ不要。
          # 旧 analyzer 7.x と Dart 3.12 の不整合で build_runner が無限待機するため、不要時はスキップする。
          if grep -rEq "^part '.*\.(g|freezed)\.dart';" lib test; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No generated-code 'part' directives found - skipping build_runner"
          fi

      # debug 専用: Secret があればそれを使い、無ければダミーを生成（release ではこの挙動を使わない）
      - name: Write google-services.json (debug, dummy allowed)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            python3 scripts/generate_google_services_json.py
          fi

      - name: Build Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  build-release:
    name: Build Release APK/AAB (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        timeout-minutes: 10
        run: |
          # lib/test に生成コード(part '*.g.dart' / '*.freezed.dart')を使うソースが無ければ不要。
          # 旧 analyzer 7.x と Dart 3.12 の不整合で build_runner が無限待機するため、不要時はスキップする。
          if grep -rEq "^part '.*\.(g|freezed)\.dart';" lib test; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No generated-code 'part' directives found - skipping build_runner"
          fi

      - name: Require release secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RC_GOOGLE_KEY: ${{ secrets.RC_GOOGLE_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          AD_BANNER_ID: ${{ secrets.AD_BANNER_ID }}
          AD_INTERSTITIAL_ID: ${{ secrets.AD_INTERSTITIAL_ID }}
          AD_REWARDED_ID: ${{ secrets.AD_REWARDED_ID }}
        run: |
          missing=0
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_PASSWORD UPLOAD_KEY_ALIAS GOOGLE_SERVICES_JSON_BASE64 RC_GOOGLE_KEY ADMOB_APP_ID AD_BANNER_ID AD_INTERSTITIAL_ID AD_REWARDED_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v が未設定です。release ビルドは実行できません"
              missing=1
            fi
          done
          exit $missing

      - name: Restore keystore and google-services.json
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          grep -q '"project_info"' android/app/google-services.json

      - name: Build release APK and AAB
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          RC_GOOGLE_KEY: ${{ secrets.RC_GOOGLE_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          AD_BANNER_ID: ${{ secrets.AD_BANNER_ID }}
          AD_INTERSTITIAL_ID: ${{ secrets.AD_INTERSTITIAL_ID }}
          AD_REWARDED_ID: ${{ secrets.AD_REWARDED_ID }}
        run: |
          export UPLOAD_STORE_FILE="$RUNNER_TEMP/upload-keystore.jks"
          DEFINES="--dart-define=RC_GOOGLE_KEY=$RC_GOOGLE_KEY --dart-define=AD_BANNER_ID=$AD_BANNER_ID --dart-define=AD_INTERSTITIAL_ID=$AD_INTERSTITIAL_ID --dart-define=AD_REWARDED_ID=$AD_REWARDED_ID"
          # ADMOB_APP_ID は環境変数として gradle が読む（manifestPlaceholders）
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

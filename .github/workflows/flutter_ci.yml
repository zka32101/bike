name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Prepare Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze || true  # Continue even if analyzer finds issues, to see output

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze || true  # Continue even if analyzer finds issues, to see output

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "⚠️ GOOGLE_SERVICES_JSON_BASE64 not set - using debug mode"
            mkdir -p android/app/src/main
            # Create minimal placeholder (APK won't have Firebase but will compile)
            echo '{}' > android/app/google-services.json
          else
            mkdir -p android/app/src/main
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee build.log || true

      - name: Show APK Build Log on Failure
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log || echo "Log file not found"

      - name: Verify APK artifact
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK found via find"

          # Check common locations
          echo "=== Checking standard Flutter APK location ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Standard location does not exist"

          # Try alternate locations
          echo "=== Checking alternate locations ==="
          [ -d "build/app/outputs/apk" ] && ls -la build/app/outputs/apk/
          [ -d "build/outputs" ] && ls -la build/outputs/

          # Find any recent APK
          APK_PATH=$(find build -name "app-*.apk" -o -name "*debug*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✓ APK found: $APK_PATH ($APK_SIZE)"
          else
            echo "⚠️ No APK file found - build may have created output in non-standard location"
            exit 0  # Don't fail, just warn
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

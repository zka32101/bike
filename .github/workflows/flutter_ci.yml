name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Prepare Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze || true  # Continue even if analyzer finds issues, to see output

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze || true  # Continue even if analyzer finds issues, to see output

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "⚠️ GOOGLE_SERVICES_JSON_BASE64 not set - using debug mode"
            # Create minimal valid Firebase config for debug builds
            cat > android/app/google-services.json << 'EOF'
{
  "project_info": {
    "project_number": "0",
    "project_id": "debug-project",
    "storage_bucket": "debug-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:0:android:debug",
        "android_client_info": {
          "package_name": "com.yourwish.bikelicensekore"
        }
      },
      "oauth_client": [],
      "api_key": [],
      "services": {
        "analytics_service": {
          "status": 1
        },
        "appinvite_service": {
          "status": 1
        },
        "ads_service": {
          "status": 1
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          else
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Build Debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Show APK Build Log on Failure
        if: always()
        run: |
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log || echo "Log file not found"

          echo ""
          echo "=== Gradle build error summary ==="
          grep -i "error\|failed\|exception" build.log | tail -20 || echo "No error patterns found"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Verify APK artifact
        if: success()
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK found via find"

          # Check common locations
          echo "=== Checking standard Flutter APK location ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "Standard location does not exist"

          # Try alternate locations
          echo "=== Checking alternate locations ==="
          [ -d "build/app/outputs/apk" ] && ls -la build/app/outputs/apk/
          [ -d "build/outputs" ] && ls -la build/outputs/

          # Find any recent APK
          APK_PATH=$(find build -name "app-*.apk" -o -name "*debug*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✓ APK found: $APK_PATH ($APK_SIZE)"
          else
            echo "⚠️ No APK file found - build may have created output in non-standard location"
            exit 0  # Don't fail, just warn
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/**/*.apk
          retention-days: 30
          if-no-files-found: ignore

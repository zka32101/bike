org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
# Multiple parallel APK-split packaging workers reading the same keystore file
# concurrently can corrupt the read and raise "Given final block not properly
# padded" during release signing. Serialize workers to avoid the race.
org.gradle.workers.max=1

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F7FA;
      color: #1B2A4A;
    }
    a { color: #FF6A00; text-decoration: none; }
    a:hover { color: #E55A00; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F7F7FA; padding: 16px; display: flex; flex-direction: column; gap: 24px;">
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px;">
    <h1 style="font-size: 20px; font-weight: 700; color: #1B2A4A;">バイク免許Kore</h1>
    <div style="width: 40px; height: 40px; background: #FF6A00; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 16px;">👤</div>
  </div>

  <!-- Learning Progress Section -->
  <div style="background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h2 style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 12px; text-transform: uppercase;">学習進捗</h2>

    <!-- Category Progress -->
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 14px; font-weight: 500;">交通規則</span>
          <span style="font-size: 14px; font-weight: 600; color: #FF6A00;">72%</span>
        </div>
        <div style="width: 100%; height: 8px; background: #E8E8EB; border-radius: 4px; overflow: hidden;">
          <div style="width: 72%; height: 100%; background: linear-gradient(90deg, #FF6A00, #FFB347); border-radius: 4px;"></div>
        </div>
      </div>

      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 14px; font-weight: 500;">危機回避</span>
          <span style="font-size: 14px; font-weight: 600; color: #FF6A00;">58%</span>
        </div>
        <div style="width: 100%; height: 8px; background: #E8E8EB; border-radius: 4px; overflow: hidden;">
          <div style="width: 58%; height: 100%; background: linear-gradient(90deg, #FF6A00, #FFB347); border-radius: 4px;"></div>
        </div>
      </div>

      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 14px; font-weight: 500;">機械知識</span>
          <span style="font-size: 14px; font-weight: 600; color: #FF6A00;">85%</span>
        </div>
        <div style="width: 100%; height: 8px; background: #E8E8EB; border-radius: 4px; overflow: hidden;">
          <div style="width: 85%; height: 100%; background: linear-gradient(90deg, #FF6A00, #FFB347); border-radius: 4px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Today's Schedule -->
  <div style="background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h2 style="font-size: 14px; font-weight: 600; color: #666; margin-bottom: 12px; text-transform: uppercase;">今日の予定</h2>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFF5F0; border-radius: 12px; border-left: 4px solid #FF6A00;">
        <span style="font-size: 20px;">📝</span>
        <div>
          <div style="font-size: 14px; font-weight: 600;">交通規則 練習問題</div>
          <div style="font-size: 12px; color: #999;">10問 / 約15分</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #F5F5FF; border-radius: 12px; border-left: 4px solid #1B2A4A;">
        <span style="font-size: 20px;">🎯</span>
        <div>
          <div style="font-size: 14px; font-weight: 600;">危機回避 復習</div>
          <div style="font-size: 12px; color: #999;">苦手問題 8問 / 約12分</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Weak Areas Recommendation -->
  <div style="background: linear-gradient(135deg, #FF6A00, #E55A00); border-radius: 16px; padding: 16px; color: white; box-shadow: 0 4px 12px rgba(255,106,0,0.2);">
    <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">⚠️ 集中学習推奨</div>
    <div style="font-size: 13px; line-height: 1.5;">危機回避の正解率が58%です。<br>まずこの分野を集中的に学習することをお勧めします。</div>
  </div>

  <!-- CTA Button -->
  <button style="background: #FF6A00; color: white; border: none; border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; transition: background 0.2s;">
    練習問題を開始
  </button>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F7FA;
      color: #1B2A4A;
    }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F7F7FA; display: flex; flex-direction: column;">
  <!-- Top Bar -->
  <div style="background: white; padding: 12px 16px; border-bottom: 1px solid #E8E8EB; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 13px; color: #999;">交通規則 第1問 / 10</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 12px; font-weight: 600; color: #FF6A00;">⏱ 5:23</span>
    </div>
  </div>

  <!-- Progress Bar -->
  <div style="height: 4px; background: #E8E8EB; width: 100%;">
    <div style="height: 100%; width: 10%; background: #FF6A00;"></div>
  </div>

  <!-- Content -->
  <div style="flex: 1; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto;">
    <!-- Question -->
    <div>
      <h2 style="font-size: 16px; font-weight: 600; line-height: 1.6; color: #1B2A4A;">原付一種は最大何人乗車できるか？</h2>
    </div>

    <!-- Answer Choices -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button style="background: white; border: 2px solid #E8E8EB; border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: #1B2A4A;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 24px; height: 24px; border: 2px solid #E8E8EB; border-radius: 50%; flex-shrink: 0;"></div>
          <span>1人乗り（運転者のみ）</span>
        </div>
      </button>

      <button style="background: white; border: 2px solid #FF6A00; border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: #1B2A4A; background: #FFF5F0;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 24px; height: 24px; border: 2px solid #FF6A00; border-radius: 50%; flex-shrink: 0; background: #FF6A00;"></div>
          <span style="font-weight: 600;">2人乗り（1人迄）</span>
        </div>
      </button>

      <button style="background: white; border: 2px solid #E8E8EB; border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: #1B2A4A;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 24px; height: 24px; border: 2px solid #E8E8EB; border-radius: 50%; flex-shrink: 0;"></div>
          <span>3人乗り（2人迄）</span>
        </div>
      </button>

      <button style="background: white; border: 2px solid #E8E8EB; border-radius: 12px; padding: 16px; text-align: left; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; color: #1B2A4A;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 24px; height: 24px; border: 2px solid #E8E8EB; border-radius: 50%; flex-shrink: 0;"></div>
          <span>法律上は人数制限なし</span>
        </div>
      </button>
    </div>

    <!-- Hint Button -->
    <div style="display: flex; gap: 12px;">
      <button style="flex: 1; background: white; border: 1px solid #E8E8EB; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: #FF6A00; transition: all 0.2s;">
        💡 ヒントを表示
      </button>
      <button style="flex: 1; background: white; border: 1px solid #E8E8EB; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 500; cursor: pointer; color: #1B2A4A; transition: all 0.2s;">
        📖 解説を表示
      </button>
    </div>
  </div>

  <!-- Bottom Actions -->
  <div style="background: white; border-top: 1px solid #E8E8EB; padding: 12px 16px; display: flex; gap: 12px;">
    <button style="flex: 1; background: white; border: 1px solid #E8E8EB; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: #1B2A4A;">
      前へ
    </button>
    <button style="flex: 1; background: #FF6A00; color: white; border: none; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;">
      次へ
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

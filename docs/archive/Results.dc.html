<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #F7F7FA, #F0F5FF);
      color: #1B2A4A;
    }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; padding: 16px; display: flex; flex-direction: column; gap: 20px;">
  <!-- Header -->
  <div style="text-align: center; padding-top: 24px;">
    <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">テスト完了！</h1>
    <p style="font-size: 14px; color: #999;">交通規則 - 練習問題</p>
  </div>

  <!-- Score Card -->
  <div style="background: linear-gradient(135deg, #FF6A00, #E55A00); border-radius: 20px; padding: 32px 24px; color: white; text-align: center; box-shadow: 0 8px 24px rgba(255,106,0,0.2);">
    <div style="font-size: 48px; font-weight: 700; margin-bottom: 8px;">72%</div>
    <div style="font-size: 16px; font-weight: 500; margin-bottom: 24px;">7問 / 10問正解</div>
    <div style="display: flex; gap: 16px; justify-content: center; font-size: 14px;">
      <div>
        <div style="font-size: 18px; font-weight: 700;">7</div>
        <div style="font-size: 11px; opacity: 0.9;">正解</div>
      </div>
      <div>
        <div style="font-size: 18px; font-weight: 700;">3</div>
        <div style="font-size: 11px; opacity: 0.9;">不正解</div>
      </div>
      <div>
        <div style="font-size: 18px; font-weight: 700;">0</div>
        <div style="font-size: 11px; opacity: 0.9;">未回答</div>
      </div>
    </div>
  </div>

  <!-- Status Badge -->
  <div style="text-align: center; padding: 16px; background: white; border-radius: 12px; border: 2px solid #FFD966;">
    <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
    <div style="font-size: 14px; font-weight: 600; color: #1B2A4A;">合格ラインに達していません</div>
    <div style="font-size: 12px; color: #999; margin-top: 4px;">あと3点で合格（90点以上必要）</div>
  </div>

  <!-- Category Breakdown -->
  <div style="background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h3 style="font-size: 13px; font-weight: 600; color: #999; margin-bottom: 12px; text-transform: uppercase;">分野別成績</h3>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="font-size: 13px; font-weight: 500;">速度制限</span>
          <span style="font-size: 13px; font-weight: 600; color: #FF6A00;">3/3</span>
        </div>
        <div style="width: 100%; height: 6px; background: #E8E8EB; border-radius: 3px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: #4CAF50;"></div>
        </div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="font-size: 13px; font-weight: 500;">二人乗り規制</span>
          <span style="font-size: 13px; font-weight: 600; color: #FF6A00;">2/3</span>
        </div>
        <div style="width: 100%; height: 6px; background: #E8E8EB; border-radius: 3px; overflow: hidden;">
          <div style="width: 66%; height: 100%; background: #FFA726;"></div>
        </div>
      </div>
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
          <span style="font-size: 13px; font-weight: 500;">積載制限</span>
          <span style="font-size: 13px; font-weight: 600; color: #FF6A00;">2/4</span>
        </div>
        <div style="width: 100%; height: 6px; background: #E8E8EB; border-radius: 3px; overflow: hidden;">
          <div style="width: 50%; height: 100%; background: #EF5350;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Progress Graph -->
  <div style="background: white; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
    <h3 style="font-size: 13px; font-weight: 600; color: #999; margin-bottom: 12px; text-transform: uppercase;">学習の推移</h3>
    <div style="display: flex; align-items: flex-end; justify-content: space-around; gap: 8px; height: 120px; padding: 16px 8px; background: #F9F9FB; border-radius: 8px;">
      <div style="text-align: center;">
        <div style="width: 32px; height: 60%; background: #FFD4B4; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="font-size: 10px; color: #999;">1日目</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 32px; height: 70%; background: #FFC499; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="font-size: 10px; color: #999;">2日目</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 32px; height: 65%; background: #FFB87E; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="font-size: 10px; color: #999;">3日目</div>
      </div>
      <div style="text-align: center;">
        <div style="width: 32px; height: 75%; background: #FF6A00; border-radius: 4px; margin-bottom: 8px;"></div>
        <div style="font-size: 10px; color: #999;">今回</div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;">
    <button style="background: #FF6A00; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;">
      不正解を復習する
    </button>
    <button style="background: white; color: #FF6A00; border: 2px solid #FF6A00; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;">
      もう一度挑戦
    </button>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

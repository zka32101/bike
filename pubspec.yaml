name: bike_license_kore
description: "原付・バイク免許コレ！— 二輪免許（原付〜大型二輪）特化の学科試験対策アプリ"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状態管理
  flutter_riverpod: ^2.5.1

  # Firebase（実プロジェクト接続はFirebase設定ファイル追加後に有効化）
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4
  firebase_analytics: ^10.8.5
  firebase_crashlytics: ^3.4.13
  firebase_remote_config: ^4.3.14

  # 課金（期間パス・非消費型）
  purchases_flutter: ^6.29.1

  # 広告（Google Mobile Ads）
  google_mobile_ads: ^6.0.0

  # 演出
  lottie: ^3.1.0

  # ローカル永続化（Firebase未接続時のフォールバック／オフラインキャッシュ）
  shared_preferences: ^2.2.2

  # ハッシング（分析キャッシュの指紋計算用）
  crypto: ^3.0.3

  # 音声効果
  just_audio: ^0.9.36

  # 通知
  flutter_local_notifications: ^17.1.0

  # ネットワーク状態監視（オフライン対応）
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/lottie/

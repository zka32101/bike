name: bike_license_kore
description: "原付・バイク免許コレ！— 二輪免許（原付〜大型二輪）特化の学科試験対策アプリ"
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # うかラボ共通基盤（タグ固定。main は参照しない）
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v0.4.4
  yourwish_kentei:
    git:
      url: https://github.com/zka32101/yourwish_kentei.git
      ref: v0.2.0

  # 状態管理（3.xはStateNotifier廃止等の破壊的変更が大きいため2.x系に固定）
  flutter_riverpod: ">=2.5.1 <3.0.0"

  # Firebase（実プロジェクト接続はFirebase設定ファイル追加後に有効化）
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0

  # 認証（Googleサインインのみ）
  google_sign_in: ^7.2.0

  # 課金（期間パス・非消費型）
  purchases_flutter: ^10.0.0

  # 広告（Google Mobile Ads）
  google_mobile_ads: ^9.1.0

  # 演出
  lottie: ^3.1.0

  # ローカル永続化（Firebase未接続時のフォールバック／オフラインキャッシュ）
  shared_preferences: ^2.2.2

  # ハッシング（分析キャッシュの指紋計算用）
  crypto: ^3.0.3

  # 音声効果
  just_audio: ^0.9.36

  # 通知
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.4

  # ホーム画面ウィジェット（Android: 今日の1問）
  home_widget: ^0.10.0

  # ネットワーク状態監視（オフライン対応）
  connectivity_plus: ^6.0.0

  # モデル生成（Freezed + json_serializable用）
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 国際化（日付フォーマット等）。flutter_localizations (SDK) が固定するバージョンに合わせる。
  intl: ^0.20.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.5.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/questions/
    - assets/lottie/
    - assets/guides/
    - assets/branding/

flutter_launcher_icons:
  android: true
  # iOS プロジェクトに Assets.xcassets が未生成のため無効化
  # （iOSビルドに着手する際は ios/ を Flutter 標準構成で再生成してから有効化する）
  ios: false
  image_path: "assets/icon/app_icon.png"
  # Android のアダプティブアイコン（うかラボ共通の生成ツールで作成。前景は中央66%以内）
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 21
